# Configuração avançada do Sway para Steam no Wolf
# Garante layout tabbed para evitar split screen e prioriza jogos em tela cheia

# Layout padrão em abas (100% de largura/altura por janela, nunca divide em mosaico)
workspace_layout tabbed
workspace main layout tabbed

# Regras para jogos Steam (nativos e Proton/Wine)
for_window [class="^steam_app_.*"] fullscreen enable, focus
for_window [class="(?i)wine.*"] fullscreen enable, focus
for_window [class="(?i)proton.*"] fullscreen enable, focus

# Janelas de diálogo / utilitários flutuantes
for_window [class="steam" window_type="dialog"] floating enable
for_window [class="steam" window_type="utility"] floating enable
for_window [class="steam" window_type="notification"] floating enable

# Janela principal do Steam Big Picture
for_window [class="steam"] layout tabbed
